[project]
name = "ai-agency"
version = "0.1.0"
description = "A LangGraph software agency driven by a local Ollama model"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=1.2",
    "langchain-ollama>=1.1",
    "pytest>=8.0",
]

[tool.pytest.ini_options]
# runs/ holds model-generated projects with their own suites. They are the
# agency's output, not its tests, and must never be collected here.
testpaths = ["tests"]
norecursedirs = ["runs", ".venv"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agency"]
